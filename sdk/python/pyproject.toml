[project]
name = "yieldskill"
version = "0.1.0"
description = "Build portable, resumable skill workflows in Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "OperatorStack" }]
maintainers = [{ name = "Boateng Opoku-Yeboah" }]
keywords = ["coding agents", "skills", "workflows"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://yield.operatorstack.systems/"
Documentation = "https://yield.operatorstack.systems/docs/"
Repository = "https://github.com/operatorstack/yield"
Issues = "https://github.com/operatorstack/yield/issues"

[project.scripts]
yskill = "yieldskill._cli:main"

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["yieldskill", "yieldskill._runtime"]

[tool.setuptools.package-data]
yieldskill = ["_runtime/*"]
